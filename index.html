<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<title>Pratham | Salesforce Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue: #0A84FF;
    --blue-dark: #004FC4;
    --cyan: #00C6FF;
    --bg: #080C14;
    --surface: #0F1722;
    --surface2: #162035;
    --border: rgba(0,198,255,0.15);
    --text: #EDF2FF;
    --muted: #7A90B0;
    --mono: 'Space Mono', monospace;
    --display: 'Syne', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--display);
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 2.5rem;
    background: rgba(8,12,20,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--cyan);
    letter-spacing: 0.1em;
  }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.08em;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--cyan); }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 6rem 2rem 4rem;
    position: relative;
    overflow: hidden;
  }

  .hero-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,198,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,198,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .hero-glow {
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(10,132,255,0.12) 0%, transparent 65%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .hero-content {
    position: relative; z-index: 1;
    max-width: 820px; width: 100%;
  }

  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--cyan);
    letter-spacing: 0.12em;
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 2px;
    margin-bottom: 2rem;
    animation: fadeUp 0.7s ease both;
  }
  .badge-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .hero-name {
    font-size: clamp(3.5rem, 9vw, 7rem);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    animation: fadeUp 0.7s 0.1s ease both;
  }
  .hero-name span {
    display: block;
    background: linear-gradient(135deg, #fff 30%, var(--cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-title {
    font-family: var(--mono);
    font-size: clamp(0.8rem, 2vw, 1rem);
    color: var(--muted);
    margin-top: 1.5rem;
    letter-spacing: 0.06em;
    animation: fadeUp 0.7s 0.2s ease both;
  }
  .hero-title em { color: var(--blue); font-style: normal; }

  .hero-desc {
    margin-top: 1.8rem;
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    color: var(--muted);
    max-width: 540px;
    line-height: 1.75;
    animation: fadeUp 0.7s 0.3s ease both;
  }

  .hero-cta {
    display: flex; gap: 1rem; flex-wrap: wrap;
    margin-top: 2.5rem;
    animation: fadeUp 0.7s 0.4s ease both;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--blue);
    color: #fff;
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    padding: 12px 24px;
    border-radius: 2px;
    text-decoration: none;
    transition: background 0.2s, transform 0.15s;
  }
  .btn-primary:hover { background: var(--blue-dark); transform: translateY(-2px); }
  .btn-outline {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border);
    color: var(--cyan);
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    padding: 12px 24px;
    border-radius: 2px;
    text-decoration: none;
    transition: border-color 0.2s, transform 0.15s;
  }
  .btn-outline:hover { border-color: var(--cyan); transform: translateY(-2px); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* SECTIONS SHARED */
  section {
    padding: 6rem 2rem;
    max-width: 920px;
    margin: 0 auto;
  }
  .section-label {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    color: var(--cyan);
    margin-bottom: 0.75rem;
    text-transform: uppercase;
  }
  .section-title {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 2rem;
  }

  /* DIVIDER */
  .divider {
    width: 100%; height: 1px;
    background: var(--border);
    max-width: 920px;
    margin: 0 auto;
  }

  /* ABOUT */
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    align-items: start;
  }
  .about-text p {
    color: var(--muted);
    line-height: 1.85;
    font-size: 0.97rem;
    margin-bottom: 1rem;
  }
  .about-text p strong { color: var(--text); }

  .about-stats {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    transition: border-color 0.2s, transform 0.2s;
  }
  .stat-card:hover { border-color: var(--cyan); transform: translateX(4px); }
  .stat-num {
    font-size: 2rem;
    font-weight: 800;
    color: var(--cyan);
    font-family: var(--mono);
    line-height: 1;
    min-width: 56px;
  }
  .stat-label { color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
  .stat-label strong { display: block; color: var(--text); font-size: 0.95rem; margin-bottom: 2px; }

  /* SKILLS */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
  }
  .skill-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.5rem;
    transition: border-color 0.2s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }
  .skill-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    transform: scaleX(0);
    transition: transform 0.3s ease;
    transform-origin: left;
  }
  .skill-card:hover { border-color: rgba(0,198,255,0.4); transform: translateY(-4px); }
  .skill-card:hover::before { transform: scaleX(1); }

  .skill-icon { font-size: 1.5rem; margin-bottom: 0.75rem; }
  .skill-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.4rem; color: var(--text); }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.75rem; }
  .tag {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    color: var(--cyan);
    background: rgba(0,198,255,0.08);
    border: 1px solid rgba(0,198,255,0.2);
    padding: 3px 8px;
    border-radius: 2px;
  }

  /* AGENTFORCE HIGHLIGHT */
  .af-card {
    background: linear-gradient(135deg, var(--surface2) 0%, #0A1525 100%);
    border: 1px solid rgba(10,132,255,0.35);
    border-radius: 6px;
    padding: 2.5rem;
    margin-top: 2rem;
    position: relative;
    overflow: hidden;
  }
  .af-card::after {
    content: 'AGENTFORCE';
    position: absolute;
    right: -20px; top: 50%;
    transform: translateY(-50%) rotate(90deg);
    font-family: var(--mono);
    font-size: 5rem;
    font-weight: 700;
    color: rgba(10,132,255,0.04);
    letter-spacing: 0.05em;
    white-space: nowrap;
    pointer-events: none;
  }
  .af-badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--blue);
    background: rgba(10,132,255,0.1);
    border: 1px solid rgba(10,132,255,0.25);
    padding: 4px 10px;
    border-radius: 2px;
    margin-bottom: 1rem;
  }
  .af-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; }
  .af-desc { color: var(--muted); line-height: 1.8; font-size: 0.93rem; }
  .af-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1.25rem; }
  .af-pill {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: #fff;
    background: var(--blue-dark);
    padding: 5px 12px;
    border-radius: 2px;
  }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--border);
    padding: 3rem 2rem;
    text-align: center;
    max-width: 920px;
    margin: 0 auto;
  }
  .footer-links { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .footer-links a {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer-links a:hover { color: var(--cyan); }
  .footer-copy {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: rgba(122,144,176,0.5);
    letter-spacing: 0.06em;
  }

  /* RESPONSIVE */
  @media (max-width: 680px) {
    nav { padding: 1rem 1.25rem; }
    .nav-links { gap: 1.2rem; }
    .about-grid { grid-template-columns: 1fr; }
    .hero { padding: 5rem 1.25rem 3rem; }
    section { padding: 4rem 1.25rem; }
    .af-card { padding: 1.5rem; }
    .af-card::after { display: none; }
  }
  @media (max-width: 420px) {
    .nav-links { display: none; }
  }
</style>
</head>
